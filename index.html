<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mohamed Alamir Ali</title>
    <meta name="description" content="Mohamed Alamir Ali — Operations Executive, Dubai. English and Arabic CV.">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <style>
        body {
            background: url("background2.jpg") no-repeat center center fixed;
            background-size: cover;
            padding: 2rem;
        }

        .container {
            width: 100%;
            padding-right: 15px;
            padding-left: 15px;
            margin-right: auto;
            margin-left: auto;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .links-container a {
            width: 80%;
            box-shadow: 2px 2px 0 #444;
        }

        .name {
            background-color: rgba(121, 85, 72, 0.4);
            color: #ccc;
            text-shadow: 4px 4px 0 #444;
            box-shadow: 2px 2px 0 #444;
            font-size: 18px;
        }

        .subtext {
            font-size: 16px;
            background-color: rgba(121, 85, 72, 0.4);
            color: #ccc;
            text-shadow: 1px 1px 0 #444;
            box-shadow: 2px 2px 0 #444;
        }

        .portrait {
            border-color: #553c33 !important;
            width: 100%;
            max-width: 350px;
            height: auto;
            max-height: 500px;
            border-radius: 5%;
        }

        .name span {
            display: block;
        }

        .skew-1 {
            -webkit-transform: skewX(20deg);
            transform: skewX(20deg);
        }

        .skew-text-1 {
            -webkit-transform: skewX(-20deg);
            transform: skewX(-20deg);
        }

        .skew-2 {
            -webkit-transform: skewX(-20deg);
            transform: skewX(-20deg);
        }

        .skew-text-2 {
            -webkit-transform: skewX(20deg);
            transform: skewX(20deg);
        }

        @media (min-width: 576px) {
            .container {
                max-width: 540px;
            }

            .name {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>

    <!-- Content container -->
    <div class="container">

        <!-- Image and name -->
        <div style="text-align: center">
            <img loading="lazy" src="./mohamed-alamir.jpg"
                 class="portrait w3-topbar w3-bottombar w3-rightbar w3-leftbar w3-border-dark-grey"
                 alt="Mohamed Alamir Ali">
            <h1 class="name"><span class="w3-padding w3-round" style="font-weight: bolder;">Hello, I'm Mohamed Alamir</span></h1>
            <h2 class="subtext name w3-padding w3-round" style="font-weight: bolder;">SEE WHAT I'M UP TO!</h2>
        </div>

        <br><br>

        <!-- Links -->
        <div class="links-container">
            <a href="./english.html" class="w3-button w3-round w3-brown w3-hover-blue-grey skew-2"><span class="skew-text-2">Check my English CV !</span></a>
            <a href="./arabic.html" class="w3-button w3-round w3-blue w3-hover-blue-grey skew-1"><span class="skew-text-1">! تحقق من سيرتي الذاتية باللغة العربية</span></a>
            <a href="https://www.linkedin.com/in/mohamed-alamir/" class="w3-button w3-round w3-deep-orange w3-hover-blue-grey skew-2" target="_blank" rel="noopener"><span class="skew-text-2">Check my LinkedIn!</span></a>
        </div>

    </div>

</body>
</html>
